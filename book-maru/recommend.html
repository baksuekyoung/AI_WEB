<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="spine-row">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="nav-wrap">
    <a href="index.html" class="logo">책마루 <span>AI 사서</span></a>
    <button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">도서관 소개</a></li>
      <li><a href="recommend.html" class="active">AI 책 추천</a></li>
      <li><a href="care.html">마을돌봄 프로그램</a></li>
      <li><a href="care.html#contact">문의하기</a></li>
    </ul>
  </div>
</header>

<main>
  <section class="hero" style="padding-bottom: 24px;">
    <div class="container">
      <span class="eyebrow">AI 책 추천</span>
      <h1>오늘의 나에게 맞는<br>책 세 권을 찾아드려요</h1>
      <p class="lead">나이대, 관심 분야, 지금 기분을 알려주시면 AI 사서가 이유와 함께 책을 추천합니다.</p>
    </div>
  </section>

  <section style="padding-top: 0;">
    <div class="container">
      <div class="recommend-panel">

        <div class="form-card">
          <h2 style="font-size:1.2rem; margin-bottom:18px;">정보를 입력해주세요</h2>
          <form id="recommendForm">
            <div class="field">
              <label for="ageGroup">나이대</label>
              <select id="ageGroup" required>
                <option value="">선택해주세요</option>
                <option value="유아(0~7세)">유아 (0~7세)</option>
                <option value="어린이(8~13세)">어린이 (8~13세)</option>
                <option value="청소년(14~19세)">청소년 (14~19세)</option>
                <option value="성인(20~64세)">성인 (20~64세)</option>
                <option value="어르신(65세 이상)">어르신 (65세 이상)</option>
              </select>
            </div>

            <div class="field">
              <label for="interest">관심 분야</label>
              <input type="text" id="interest" placeholder="예: 동물, 우주, 요리, 역사, 그림책" required />
            </div>

            <div class="field">
              <label for="mood">오늘의 기분</label>
              <select id="mood" required>
                <option value="">선택해주세요</option>
                <option value="설레는">설레는</option>
                <option value="편안한">편안한</option>
                <option value="지치고 위로받고 싶은">지치고 위로받고 싶은</option>
                <option value="호기심 가득한">호기심 가득한</option>
                <option value="차분히 집중하고 싶은">차분히 집중하고 싶은</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;">
              책 추천받기
            </button>
            <p class="form-msg" id="formMsg"></p>
          </form>
        </div>

        <div class="result-card" id="resultCard">
          <p class="placeholder">
            왼쪽에 정보를 입력하고 &lsquo;책 추천받기&rsquo;를 누르면,<br>
            여기에 AI 사서가 고른 책 세 권이 나타납니다.
          </p>
        </div>

      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">

  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
